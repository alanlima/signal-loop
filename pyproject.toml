[project]
name = "signal-loop"
version = "0.1.0"
description = "Anonymous weekly team feedback"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]==5.6.3",
    "django>=6.0,<6.1",
    "django-htmx==1.29.0",
    "psycopg[binary]>=3.1.12,<4",
    "redis>=5,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "signal_loop"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
