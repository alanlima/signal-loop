[project]
name = "signal-loop"
version = "0.1.0"
description = "Anonymous weekly team feedback"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "psycopg[binary]>=3.1.12,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
